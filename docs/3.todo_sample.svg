<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- 9-style.md 2장 컬러 토큰 -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 (color-bg) -->
  <rect x="0" y="0" width="960" height="620" fill="#12161f"/>

  <!-- ===== NavBar (color-surface, 하단 보더) ===== -->
  <rect x="0" y="0" width="960" height="56" fill="#1b212e"/>
  <rect x="0" y="55" width="960" height="1" fill="#2f3849"/>
  <text x="24" y="35" font-family="'JetBrains Mono','Consolas',monospace" font-size="18" font-weight="700" fill="#4fd8e6">my-ToDoList</text>

  <!-- 활성 메뉴: Todo 목록 (accent + glow 언더라인) -->
  <text x="560" y="33" font-size="14" font-weight="600" fill="#4fd8e6">Todo 목록</text>
  <rect x="558" y="40" width="72" height="2" fill="#4fd8e6" filter="url(#glow)"/>

  <text x="662" y="33" font-size="14" fill="#9aa5b8">회원정보수정</text>
  <text x="770" y="33" font-size="14" fill="#9aa5b8">로그아웃</text>

  <!-- ===== 필터 바 (color-surface-raised) ===== -->
  <rect x="0" y="56" width="960" height="56" fill="#242b3a"/>
  <rect x="0" y="111" width="960" height="1" fill="#2f3849"/>

  <text x="24" y="90" font-size="14" fill="#9aa5b8">카테고리:</text>
  <rect x="96" y="72" rx="6" ry="6" width="88" height="28" fill="#1b212e" stroke="#2f3849"/>
  <text x="110" y="91" font-size="13" fill="#e8ecf4">전체 ▾</text>

  <!-- 상태 필터 칩: 전체(선택, glow) / 시작전 / 진행중 / 완료 / 지연 -->
  <rect x="200" y="72" rx="14" ry="14" width="52" height="28" fill="#1f4d52" filter="url(#glow)"/>
  <text x="213" y="91" font-size="13" fill="#4fd8e6">전체</text>

  <rect x="260" y="72" rx="14" ry="14" width="64" height="28" fill="#232a36" stroke="#2f3849"/>
  <text x="272" y="91" font-size="13" fill="#7d8aa3">시작전</text>

  <rect x="332" y="72" rx="14" ry="14" width="64" height="28" fill="#232a36" stroke="#2f3849"/>
  <text x="344" y="91" font-size="13" fill="#4fd8e6">진행중</text>

  <rect x="404" y="72" rx="14" ry="14" width="56" height="28" fill="#232a36" stroke="#2f3849"/>
  <text x="418" y="91" font-size="13" fill="#e8a94c">완료</text>

  <rect x="468" y="72" rx="14" ry="14" width="56" height="28" fill="#232a36" stroke="#2f3849"/>
  <text x="482" y="91" font-size="13" fill="#e6556b">지연</text>

  <!-- Primary Button: + Todo 등록 -->
  <rect x="832" y="70" rx="10" ry="10" width="104" height="32" fill="#4fd8e6"/>
  <text x="850" y="91" font-size="13" font-weight="600" fill="#12161f">+ Todo 등록</text>

  <!-- ===== Todo 목록 (카드형 행) ===== -->

  <!-- Row 1: 보고서 작성 - 진행중(glow) -->
  <g>
    <rect x="24" y="136" rx="10" ry="10" width="912" height="72" fill="#1b212e"/>
    <rect x="24" y="136" width="4" height="72" rx="2" fill="#4fd8e6" filter="url(#glow)"/>

    <rect x="52" y="162" width="20" height="20" rx="4" fill="none" stroke="#4fd8e6" stroke-width="2"/>

    <text x="88" y="167" font-size="15" font-weight="600" fill="#e8ecf4">보고서 작성</text>
    <text x="88" y="188" font-size="12" fill="#9aa5b8">카테고리: 업무</text>

    <rect x="260" y="158" rx="10" ry="10" width="64" height="24" fill="#1f4d52"/>
    <text x="273" y="174" font-size="12" fill="#4fd8e6">진행중</text>

    <text x="400" y="167" font-size="13" fill="#e8ecf4">09/01 ~ 09/05</text>

    <rect x="700" y="158" rx="8" ry="8" width="64" height="28" fill="none" stroke="#2f3849"/>
    <text x="716" y="177" font-size="12" fill="#e8ecf4">편집</text>
    <rect x="780" y="158" rx="8" ry="8" width="64" height="28" fill="none" stroke="#e6556b"/>
    <text x="796" y="177" font-size="12" fill="#e6556b">삭제</text>
  </g>

  <!-- Row 2: 장보기 - 완료(체크됨, 취소선) -->
  <g>
    <rect x="24" y="220" rx="10" ry="10" width="912" height="72" fill="#1b212e"/>
    <rect x="24" y="220" width="4" height="72" rx="2" fill="#e8a94c"/>

    <rect x="52" y="246" width="20" height="20" rx="4" fill="#e8a94c" stroke="#e8a94c" stroke-width="2"/>
    <path d="M56 256 L61 261 L69 250" fill="none" stroke="#12161f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="88" y="251" font-size="15" font-weight="600" fill="#9aa5b8" text-decoration="line-through">장보기</text>
    <text x="88" y="272" font-size="12" fill="#9aa5b8">카테고리: 개인</text>

    <rect x="260" y="242" rx="10" ry="10" width="52" height="24" fill="#3a3222"/>
    <text x="273" y="258" font-size="12" fill="#e8a94c">완료</text>

    <text x="400" y="251" font-size="13" fill="#9aa5b8">08/20 ~ 08/20</text>

    <rect x="700" y="242" rx="8" ry="8" width="64" height="28" fill="none" stroke="#2f3849"/>
    <text x="716" y="261" font-size="12" fill="#e8ecf4">편집</text>
    <rect x="780" y="242" rx="8" ry="8" width="64" height="28" fill="none" stroke="#e6556b"/>
    <text x="796" y="261" font-size="12" fill="#e6556b">삭제</text>
  </g>

  <!-- Row 3: 세금 신고 - 지연 -->
  <g>
    <rect x="24" y="304" rx="10" ry="10" width="912" height="72" fill="#1b212e"/>
    <rect x="24" y="304" width="4" height="72" rx="2" fill="#e6556b"/>

    <rect x="52" y="330" width="20" height="20" rx="4" fill="none" stroke="#e6556b" stroke-width="2"/>

    <text x="88" y="335" font-size="15" font-weight="600" fill="#e8ecf4">세금 신고</text>
    <text x="88" y="356" font-size="12" fill="#9aa5b8">카테고리: 기본</text>

    <rect x="260" y="326" rx="10" ry="10" width="52" height="24" fill="#3a1f26"/>
    <text x="273" y="342" font-size="12" fill="#e6556b">지연</text>

    <text x="400" y="335" font-size="13" fill="#e8ecf4">08/01 ~ 08/10</text>

    <rect x="700" y="326" rx="8" ry="8" width="64" height="28" fill="none" stroke="#2f3849"/>
    <text x="716" y="345" font-size="12" fill="#e8ecf4">편집</text>
    <rect x="780" y="326" rx="8" ry="8" width="64" height="28" fill="none" stroke="#e6556b"/>
    <text x="796" y="345" font-size="12" fill="#e6556b">삭제</text>
  </g>

  <!-- 하단 안내(빈 목록 시 노출되는 문구 예시, 참고용으로 옅게 표시) -->
  <text x="480" y="440" font-size="13" fill="#57607a" text-anchor="middle">(조건에 맞는 항목이 없을 때: "표시할 Todo가 없습니다")</text>
</svg>
